[package]
name = "exfil-config"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
anyhow = { workspace = true }
toml = "0.8"
dirs = "5"
# Root/elevation detection. rustix is a safe, maintained syscall wrapper and
# is already in the tree; the previous `is-root` crate pulled in `users`, which
# is unmaintained and carries three RUSTSEC advisories.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[lints]
workspace = true
