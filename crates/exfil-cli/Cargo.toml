[package]
name = "exfil-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "exfil"
path = "src/main.rs"

[dependencies]
exfil-core = { workspace = true }
exfil-config = { workspace = true }
exfil-store = { workspace = true }
exfil-scan = { workspace = true }
exfil-report = { workspace = true }
exfil-source = { workspace = true }
exfil-remote = { workspace = true }
exfil-task = { workspace = true }
exfil-engine = { workspace = true }
exfil-mcp = { workspace = true }
exfil-model = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
anyhow = { workspace = true }
tokio = { workspace = true }
# `wrap_help` makes clap wrap help text to the terminal width; without it long
# descriptions print as single unbroken lines. Paired with `max_term_width`
# below, help never exceeds 80 columns however wide the terminal is.
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
ratatui = "0.30"
ciborium = "0.2"
inquire = "0.7"
blake3 = "1"

[dev-dependencies]
sha2 = "0.10"

[lints]
workspace = true
