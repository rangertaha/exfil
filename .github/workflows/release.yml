name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: tar czf ../../../exfil-x86_64-unknown-linux-gnu.tar.gz exfil
          - os: macos-latest
            target: aarch64-apple-darwin
            package: tar czf ../../../exfil-aarch64-apple-darwin.tar.gz exfil
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package: 7z a ../../../exfil-x86_64-pc-windows-msvc.zip exfil.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p exfil-cli

      - name: Package
        shell: bash
        working-directory: target/${{ matrix.target }}/release
        run: ${{ matrix.package }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            exfil-*.tar.gz
            exfil-*.zip
